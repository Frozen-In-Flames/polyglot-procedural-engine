<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>First Light · a game on the Polyglot Procedural Engine</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #title {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 10;
        color: #e2e8f0; font-size: 13px; font-weight: 800; letter-spacing: 0.35em;
        text-shadow: 0 0 18px rgba(125, 211, 252, 0.6); transition: opacity 2s;
        pointer-events: none;
      }
      #hint {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
        color: #94a3b8; font-size: 12px; background: rgba(10,14,24,0.72);
        padding: 7px 14px; border-radius: 999px; border: 1px solid #1e293b;
        transition: opacity 1.5s; pointer-events: none; white-space: nowrap;
      }
      #caption {
        position: fixed; top: 34%; left: 50%; transform: translateX(-50%); z-index: 10;
        color: #fef3c7; font-size: 20px; font-weight: 300; letter-spacing: 0.12em;
        text-shadow: 0 0 24px rgba(251, 191, 36, 0.55); opacity: 0;
        transition: opacity 1.2s; pointer-events: none;
      }
      #foundry {
        display: none; position: fixed; top: 12px; right: 12px; z-index: 10;
        background: rgba(10, 14, 24, 0.85); border: 1px solid #1e293b;
        border-radius: 12px; padding: 10px 12px; color: #e2e8f0; max-width: 300px;
      }
      #foundry h2 { margin: 0 0 2px; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
      #foundry p { margin: 0 0 6px; font-size: 10px; color: #94a3b8; }
      #lever-list { list-style: none; margin: 0; padding: 0; font-size: 11px; }
      #lever-list li { padding: 3px 0; border-top: 1px solid #1e293b; color: #cbd5e1; }
      #lever-list li.active { color: #7dd3fc; font-weight: 700; }
      #lever-list li.dormant { color: #475569; }
      #btn-audio {
        position: fixed; bottom: 14px; right: 14px; z-index: 10;
        background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
        border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer;
      }
      #err {
        display: none; position: fixed; inset: auto 12px 12px 12px; z-index: 50;
        background: rgba(80, 10, 10, 0.92); color: #fecaca; font-size: 12px;
        padding: 10px 14px; border-radius: 8px; font-family: monospace;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="scene"></canvas></div>
    <div id="title">FIRST LIGHT</div>
    <div id="caption"></div>
    <div id="hint">WASD move &middot; drag to look &middot; E interact</div>
    <div id="foundry">
      <h2>THE FOUNDRY</h2>
      <p>E grab a lever &middot; &larr;/&rarr; adjust &middot; the world answers</p>
      <ul id="lever-list"></ul>
    </div>
    <button id="btn-audio">Sound on</button>
    <div id="err"></div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
