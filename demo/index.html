<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>First Light - Polyglot Procedural Engine demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(10, 14, 24, 0.82); border: 1px solid #1e293b;
        border-radius: 12px; padding: 12px 14px; color: #e2e8f0;
        max-width: 320px; backdrop-filter: blur(6px);
      }
      #hud h1 { margin: 0 0 2px; font-size: 15px; font-weight: 800; letter-spacing: 0.04em; }
      #hud p { margin: 0 0 8px; font-size: 11px; color: #94a3b8; }
      #pipeline { list-style: none; margin: 8px 0; padding: 0; font-size: 11px; }
      #pipeline li { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; border-top: 1px solid #1e293b; }
      #pipeline li span:last-child { color: #67e8f9; font-weight: 700; text-align: right; }
      #btns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
      #btns button {
        background: #0e7490; color: #fff; border: none; border-radius: 8px;
        padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
      }
      #btns button:disabled { background: #334155; cursor: default; opacity: 0.6; }
      #btns button.secondary { background: #1e293b; }
      #btns button.active { background: #7c3aed; }
      #ver { font-size: 10px; color: #67e8f9; font-weight: 700; margin-left: 6px; }
      #controls-row { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
      #controls-row label { font-size: 11px; color: #94a3b8; }
      #input-scheme {
        background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
        border-radius: 8px; padding: 6px 8px; font-size: 12px;
      }
      #input-help { margin-top: 8px; font-size: 11px; color: #94a3b8; line-height: 1.5; }
      #input-help div::before { content: "▸ "; color: #67e8f9; }
      #status { margin-top: 8px; font-size: 11px; color: #fbbf24; min-height: 14px; }
      #hint {
        position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
        color: #64748b; font-size: 11px; background: rgba(10,14,24,0.7);
        padding: 6px 12px; border-radius: 999px; border: 1px solid #1e293b;
        white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis;
      }
      #joystick {
        position: fixed; z-index: 10; width: 120px; height: 120px; border-radius: 50%;
        border: 2px solid rgba(103, 232, 249, 0.35); background: rgba(10, 14, 24, 0.35);
        display: none; pointer-events: none; transform: translate(-50%, -50%);
      }
      #stick {
        position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
        background: rgba(103, 232, 249, 0.55); transform: translate(-50%, -50%);
      }
      #hud-close {
        position: absolute; top: 6px; right: 6px; width: 44px; height: 44px;
        display: flex; align-items: center; justify-content: center;
        background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
        border-radius: 8px; font-size: 18px; line-height: 1; cursor: pointer;
      }
      #hud h1, #hud p { margin-right: 44px; }
      #menu-open {
        position: fixed; top: 12px; left: 12px; z-index: 11; display: none;
        align-items: center; min-height: 44px; padding: 0 18px;
        background: rgba(10, 14, 24, 0.86); color: #e2e8f0;
        border: 1px solid #334155; border-radius: 999px;
        font: 700 13px system-ui, sans-serif; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="scene"></canvas></div>
    <div id="hud">
      <button id="hud-close" type="button" aria-label="Close panel">✕</button>
      <h1>FIRST LIGHT<span id="ver">v0.9.0</span></h1>
      <p>Zero asset files. Every pixel below is generated in code, live.</p>
      <ul id="pipeline"></ul>
      <div id="btns">
        <button id="btn-vr" disabled>Enter VR</button>
        <button id="btn-ar" disabled>Enter AR</button>
        <button id="btn-audio" class="secondary">Sound on</button>
        <button id="btn-orbit" class="secondary">Orbit view</button>
      </div>
      <div id="controls-row">
        <label for="input-scheme">Controls:</label>
        <select id="input-scheme">
          <option value="auto">Auto</option>
          <option value="desktop">Desktop</option>
          <option value="touch">Touch</option>
          <option value="xr">XR headset</option>
        </select>
      </div>
      <div id="input-help"></div>
      <div id="status"></div>
    </div>
    <button id="menu-open" type="button">☰ Menu</button>
    <div id="hint"></div>
    <div id="joystick"><div id="stick"></div></div>
    <script>
      (function () {
        var hud = document.getElementById('hud');
        var closeBtn = document.getElementById('hud-close');
        var openBtn = document.getElementById('menu-open');
        function setPanel(open) {
          hud.style.display = open ? '' : 'none';
          openBtn.style.display = open ? 'none' : 'flex';
        }
        closeBtn.addEventListener('click', function () { setPanel(false); });
        openBtn.addEventListener('click', function () { setPanel(true); });
      })();
    </script>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
